name: Monthly RSI alerts

on:
  schedule:
    - cron: "45 10 * * 1-5"   # 16:15 IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python rsi_agent.py
      - name: Save state
        run: |
          git config user.name "rsi-bot"
          git config user.email "rsi-bot@users.noreply.github.com"
          git add state.json
          git commit -m "state $(date -u +%F)" || exit 0
          git pull --rebase -X theirs origin main
          git push
